name: Deploy Application

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, production]
    timeout-minutes: 90

    steps:
      - name: Deploy on production server
        run: |
          set -euo pipefail
          cd /home/interests/Interests
          sudo git fetch origin production
          sudo git reset --hard origin/production
          sudo bash ./build-frontend.sh
          sudo docker compose build
          sudo mkdir -p backups
          sudo flock -w 3600 backups/.backup.lock docker compose up -d
          sudo docker compose exec -T back python manage.py migrate --noinput
