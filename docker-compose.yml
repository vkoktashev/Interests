x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db2:
    image: postgres:16
    logging: *default-logging
    volumes:
      - postgres_data_interests:/var/lib/postgresql/data/
    restart: always
    env_file:
      - .env
    ports:
      - "5454:5432"

  back:
    build: ./backend
    logging: *default-logging
    environment:
      CELERY_BROKER_URL: 'redis://redis:6379/0'
      CELERY_RESULT_BACKEND: 'redis://redis:6379/0'
      CACHE_URL: 'redis://redis:6379/1'
    env_file:
      - .env
    volumes:
      - /etc/letsencrypt/live/your-interests.ru/:/etc/letsencrypt/live/your-interests.ru/
      - staticfiles:/code/staticfiles
    ports:
      - "8001:8001"
    depends_on:
      - db2
      - redis
    restart: always

  redis:
    image: redis:6-alpine
    logging: *default-logging
    restart: always

  pg_backup:
    build:
      context: ./pg_backup
    logging: *default-logging
    env_file:
      - .env
    environment:
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-http://telegram-bot-api:8081}
      TELEGRAM_UPLOAD_LIMIT: ${TELEGRAM_UPLOAD_LIMIT:-1990000000}
      TELEGRAM_LOCAL_FILES: ${TELEGRAM_LOCAL_FILES:-1}
    volumes:
      - ./backups:/app/backups
      - ./backup-logs:/var/log
    restart: always
    depends_on:
      - db2
      - telegram-bot-api

  telegram-bot-api:
    image: aiogram/telegram-bot-api@sha256:92efd31add8e6252d45030717c849786fd4dff54e5410c6d70f3059334a4dd16
    logging: *default-logging
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - ./backups:/app/backups:ro
    restart: unless-stopped

  pg_backup_logs:
    image: alpine:3.22
    logging: *default-logging
    command:
      - tail
      - -F
      - /var/log/cron.log
    volumes:
      - ./backup-logs:/var/log:ro
    network_mode: none
    restart: unless-stopped

volumes:
  telegram_bot_api_data:
  postgres_data_interests:
  staticfiles:
