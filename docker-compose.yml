x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db2:
    image: postgres:16
    logging: *default-logging
    volumes:
      - postgres_data_interests:/var/lib/postgresql/data/
    restart: always
    env_file:
      - .env
    ports:
      - "5454:5432"

  back:
    build: ./backend
    logging: *default-logging
    environment:
      CELERY_BROKER_URL: 'redis://redis:6379/0'
      CELERY_RESULT_BACKEND: 'redis://redis:6379/0'
      CACHE_URL: 'redis://redis:6379/1'
    env_file:
      - .env
    volumes:
      - /etc/letsencrypt/live/your-interests.ru/:/etc/letsencrypt/live/your-interests.ru/
      - staticfiles:/code/staticfiles
    ports:
      - "8001:8001"
    depends_on:
      - db2
      - redis
    restart: always

  redis:
    image: redis:6-alpine
    logging: *default-logging
    restart: always

  pg_backup:
    build:
      context: ./pg_backup
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
      - ./backup-logs:/var/log
    restart: always
    depends_on:
      - db2

  pg_backup_logs:
    image: alpine:3.22
    logging: *default-logging
    command:
      - tail
      - -F
      - /var/log/cron.log
    volumes:
      - ./backup-logs:/var/log:ro
    network_mode: none
    restart: unless-stopped

volumes:
  postgres_data_interests:
  staticfiles:
